# Builds the one image every service runs. Used by `make deploy`.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
serviceAccount: projects/$PROJECT_ID/serviceAccounts/incidentpilot-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
